name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make check
      - run: make security
      - name: Verify embedded calendar version
        run: |
          go run ./cmd/domain --version | grep -Fx "Domain Check from Registries $(cat VERSION)"
          python3 - <<'PY'
          import datetime, pathlib, re
          version = pathlib.Path('VERSION').read_text().strip()
          match = re.fullmatch(r'(\d{2})\.(\d{1,2})\.(\d{1,2})\.([1-9]\d*)', version)
          assert match, 'Invalid calendar version'
          year, month, day, sequence = map(int, match.groups())
          datetime.date(2000 + year, month, day)
          assert f'## {version}' in pathlib.Path('CHANGELOG.md').read_text()
          PY
