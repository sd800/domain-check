name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate release version
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test "$(git log -1 --format=%B)" = "Release $(cat VERSION)"
      - run: make check
      - run: make dist
      - name: Publish macOS binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Release $(cat VERSION)" --notes ''
