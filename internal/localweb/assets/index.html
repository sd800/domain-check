<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f8fc">
  <title>Domain Check from Registries</title>
  <script>/*BOOT*/</script>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="toolbar" aria-label="Preferences">
      <button id="language" class="quiet-button" type="button" aria-label="Switch language">EN <span aria-hidden="true">/</span> 简</button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="theme" class="quiet-button theme-button" type="button" aria-label="Theme: follow system">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4"/></svg>
        <span id="theme-label">System</span>
      </button>
    </header>
    <main>
      <div class="identity">
        <img class="logo" src="/assets/logo.svg" width="60" height="60" alt="">
        <h1>Domain Check <span>from Registries</span></h1>
      </div>
      <form id="lookup" role="search" autocomplete="off">
        <label for="domain" class="sr-only" id="input-label">Domain name or URL</label>
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.75" cy="10.75" r="6.75"/><path d="m16 16 4.25 4.25"/></svg>
          <input id="domain" type="text" inputmode="url" placeholder="Enter a domain or paste a URL" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" maxlength="12000">
          <button id="submit" type="submit"><span id="submit-label">Look up</span><svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg><span class="spinner" aria-hidden="true"></span></button>
        </div>
      </form>
      <section id="results" class="results" aria-label="Registration details" aria-busy="false">
        <p id="notice" class="notice" role="status" aria-live="polite"></p>
        <div id="empty" class="empty-state"><span class="empty-orbit" aria-hidden="true"></span><p id="empty-label">Registration details, straight from the source.</p></div>
        <div id="record" hidden></div>
      </section>
    </main>
    <footer>© 2026 <span>Songming.org</span></footer>
  </div>
  <noscript>This local interface requires JavaScript. You can also query a domain in Terminal.</noscript>
</body>
</html>
